# Add the persisted goal domain and its model-facing tools to the real one-shot app.
- id: base
  name: '@agentbrain-harness/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: goal
            name: '@agentbrain-harness/goal'
          - id: tool-goal
            name: '@agentbrain-harness/tool-goal'
