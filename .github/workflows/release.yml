# Pack and publish the abh release sequence: every package under packages/ plus
# the apps/ entries, all on one version. The vendored framework and the native
# packages are separate sequences with their own workflows and version lines.
#
# Pack runs without credentials on every pull request and master push, so a
# pull request proves the whole publish set still packs. Publication is a
# manual dispatch from a abh-v* tag and consumes exactly the packed bytes. The
# maintainer sequence is documented in docs/release-checklist.md.
name: Release (abh)

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packed tarballs to npm. Must run from a abh-v* tag.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Pack runs per ref so concurrent pull requests never displace each
  # other; the publish job below serializes the shared dist-tag state.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  ABH_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    name: Pack npm tarballs
    runs-on: ubuntu-24.04
    steps:
      # Complete history: the release scripts read tags.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        env:
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: pnpm run release:verify --family abh

      - name: Build
        run: pnpm run build:official

      - name: Pack release tarballs
        run: pnpm run release:pack --family abh --out dist/npm

      # The harness packages declare the vendored framework as a peer, and this
      # verification must not depend on the registry already carrying matching
      # versions — one pull request may bump both families before either
      # publishes — so it installs that family's pack output too. Only dist/npm
      # is published.
      - name: Pack the vendored framework for verification
        run: pnpm run release:pack --family vendor --out dist/npm-vendor

      # abh-sandbox-local declares the Landlock entry as a runtime dependency, so
      # the verification needs its tarball. Its platform packages stay out: they
      # are optional, and building them needs a musl toolchain per architecture.
      - name: Pack the Landlock entry for verification
        run: |
          pnpm --dir native/landlock-run run build:ts
          pnpm --dir native/landlock-run/packages/entry pack --pack-destination "$PWD/dist/npm-landlock"

      - name: Verify packed install
        run: pnpm run release:verify-packed-install --family abh --from dist/npm --from dist/npm-vendor --from dist/npm-landlock

      - uses: actions/upload-artifact@v4
        with:
          name: abh-npm-tarballs
          path: dist/npm/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    if: inputs.publish
    needs: pack
    runs-on: ubuntu-24.04
    # Required reviewers and the allowed tags live on the environment; this is
    # the only step in the sequence that can write to the registry.
    environment: npm-publish
    concurrency:
      group: Release-publish
      cancel-in-progress: false
    permissions:
      contents: read
      # OIDC trusted publishing: npm exchanges this GitHub-issued id-token for a
      # short-lived, package-scoped publish token. No long-lived npm token is
      # stored. Each package's trusted-publisher config must name this repo, the
      # `release.yml` workflow, and the `npm-publish` environment; configure it
      # once with scripts/release/trust-github.sh. Publishing from a public repo
      # over OIDC also attaches provenance automatically.
      id-token: write
    steps:
      # Checkout and install carry the release scripts only. There is no build
      # step: publication uploads the bytes the pack job produced.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing needs npm >= 11.5.1; the exchange is a no-op on
      # older npm and would fall back to a token that is no longer provided.
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install (immutable, no package scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: abh-npm-tarballs
          path: dist/npm

      # No NODE_AUTH_TOKEN: publication authenticates over OIDC against each
      # package's trusted-publisher config. `release:publish` shells out to the
      # global `npm publish`, which performs the exchange.
      - name: Publish tarballs
        run: pnpm run release:publish --family abh --from dist/npm
