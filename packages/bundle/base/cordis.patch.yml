# The abh-base bundle patch: the shared core of every abh profile, applied as
# ONE insert over the empty profile root. Later bundle patches and the user's
# profile cordis.patch.yml address these rows by id, with the last write
# winning per row.
#
# A patch replaces the targeted row's whole `config` rather than merging into
# it, so a row whose value differs by mode does NOT live here: it belongs to
# each mode bundle, keeping any single row down to one bundle layer plus the
# user's. Mode-specific rows appear below only with shared plugin identity and
# neutral defaults; each mode bundle restates its complete configuration.
#
# Row order carries no load semantics (activation is service-availability
# driven); the grouping is for readers.

- insert:
    - id: timer
      name: '@agentbrain-harness/cordis-plugin-timer'

    - id: hmr
      name: '@agentbrain-harness/cordis-plugin-hmr'
      config:
        root: ['.']

    - id: llm
      name: '@agentbrain-harness/llm'

    - id: session
      name: '@agentbrain-harness/session'

    - id: typert
      name: '@agentbrain-harness/typert-registry'

    - id: typert-loader
      name: '@agentbrain-harness/typert-loader'

    - id: typert-gateway
      name: '@agentbrain-harness/api-gateway'

    - id: session-title
      name: '@agentbrain-harness/session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: session-title-llm
      name: '@agentbrain-harness/session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 64
        timeoutMs: 60000

    - id: user-questions
      name: '@agentbrain-harness/user-questions'

    - id: agent
      name: '@agentbrain-harness/agent'

    # The transport-independent default for Agents created by entry points.
    # Settings may supply a saved selection; consumers read it at creation time.
    - id: agent-default-model
      name: '@agentbrain-harness/agent-default-model'
      config:
        # Provider-neutral default: the pi-ai `default` route is a BYO
        # OpenAI-compatible endpoint (ABH_LLM_API_KEY / ABH_LLM_MODEL, with a
        # fixed OpenAI baseURL). No vendor is hardcoded; llm-deepseek stays choosable.
        provider: default
        model: !!js process.env.ABH_LLM_MODEL ?? 'gpt-5'

    - id: jobs
      name: '@agentbrain-harness/jobs-local'

    - id: llm-retry
      name: '@agentbrain-harness/llm-retry'

    # User-settings document (`$ABH_HOME/settings.yaml`, hot-reloaded): a
    # `llm-deepseek:` or `llm-pi-ai:` section there overrides the adapter entries
    # below without a restart, and is what the web Models page writes.
    - id: settings
      name: '@agentbrain-harness/settings-file'

    # Credential sources: inherited environment over the managed
    # `$ABH_HOME/.credentials.yaml`, with project and user `.env` fallbacks.
    # Adapters resolve references per request; the Models page writes only the
    # managed document, which is never materialized into the process environment.
    - id: credentials
      name: '@agentbrain-harness/credentials-local'

    # Sign-in flows for providers that ship a login (pi-ai's ChatGPT/Claude/…):
    # the seam obtains a credential the credentials store then holds. The web
    # Models page and first-run onboarding drive it through oauth.*; llm-pi-ai
    # registers its flows only while this is mounted.
    - id: authorization
      name: '@agentbrain-harness/authorization'

    # The pi-ai multi-provider twin, mounted dormant: zero routes (and no extra
    # models in the picker) until a `llm-pi-ai:` settings section supplies provider
    # profiles — then those routes register live, keys resolving per request
    # through their apiKeyEnv references, and drop again when the section empties.
    # Supplying those profiles is exactly what the web Models page does. Which
    # adapters exist is composition; which providers run is the user's settings
    # document.
    - id: llm-pi-ai
      name: '@agentbrain-harness/llm-pi-ai'
      config:
        providers:
          # Provider-neutral default route: a BYO OpenAI-compatible endpoint.
          # Credential and model are operator-set (ABH_LLM_API_KEY /
          # ABH_LLM_MODEL); the baseURL points at OpenAI as a fixed example
          # default. Additional provider routes, including a different endpoint,
          # come from the user's llm-pi-ai settings section.
          default:
            displayName: 'Custom (OpenAI-compatible)'
            api: openai-completions
            baseURL: 'https://api.openai.com/v1'
            # ABH_LLM_BASE_URL, when set, points the default route at any
            # OpenAI-compatible endpoint (a self-hosted gateway, a local runtime)
            # without editing config; unset, the fixed OpenAI example above
            # applies. A reference, not a `!!js` inline, so the config-source
            # ownership gate stays satisfied.
            baseURLEnv: ABH_LLM_BASE_URL
            apiKeyEnv: ABH_LLM_API_KEY
            models:
              - id: !!js process.env.ABH_LLM_MODEL ?? 'gpt-5'
          # A keyless local runtime (Ollama, LM Studio) is NOT shipped as an
          # always-registered route: a declared route reports active, and the
          # first-run readiness join treats a keyless active route as usable, so
          # a config-shipped localhost route would claim the user is ready even
          # with no runtime installed. The onboarding plugin instead probes the
          # local endpoint by URL and, when the user starts local, writes the
          # `local` route into their settings alongside the default-model choice.

    # Default display metadata for the account-login providers. The Models page
    # and onboarding render these names, logos, and order over the engine's own
    # provider names (which read "OpenAI Codex", "Anthropic", "xAI"). Vendor
    # names live here as overridable data, never in harness code; the user's
    # `ui-provider-overlay` settings section wins per provider id. Known account
    # providers receive their official display names and brand marks; unknown
    # providers keep their engine name and a monogram, sorted after.
    - id: provider-overlay
      name: '@agentbrain-harness/provider-overlay'
      config:
        providers:
          openai-codex:
            displayName: ChatGPT
            logo: openai
            order: 1
          anthropic:
            displayName: Claude
            logo: anthropic
            order: 2
          xai:
            displayName: Grok
            logo: xai
            order: 3
          github-copilot:
            displayName: GitHub Copilot
            logo: github
            order: 4
          kimi-coding:
            displayName: Kimi For Coding
            logo: kimi
            order: 5
          openrouter:
            displayName: OpenRouter
            logo: openrouter
            order: 6
          local:
            displayName: Local (Ollama)
            logo: ollama
            order: 7

    - id: session-persistence-jsonl
      name: '@agentbrain-harness/session-persistence-jsonl'
      config:
        root: !!js abhHomePath('sessions')

    # Durable image bytes live outside the append-only session log. Messages
    # keep content-addressed references that this shared backend resolves for
    # provider requests and authorized history reads.
    - id: attachment-local
      name: '@agentbrain-harness/attachment-local'

    # Full-text session search is opt-in. `openAt: never` keeps
    # ctx.sessionQuery mounted — exact reads, titles, and lineage traces
    # (session export, subagent-fork Workspace inheritance) stay available —
    # while search calls fail with SESSION_QUERY_SEARCH_DISABLED and SQLite is
    # never opened; the Web sidebar search matches titles and workspace names
    # only. Deployments enabling content search override `openAt` to
    # `first-search` or `startup` in a later patch layer (profile
    # cordis.patch.yml or a --patch overlay), typically with a durable `path`.
    - id: session-query-sqlite
      name: '@agentbrain-harness/session-query-sqlite'
      config:
        path: ':memory:'
        openAt: never

    # Shared projection registry: subagent catalog identity (mode/label) folds
    # through its registered units, so the `list_agents` surface below fails
    # loud without it; web layers reuse this same mount for list rows.
    - id: session-projection
      name: '@agentbrain-harness/session-projection'

    # Session telemetry is mounted but disabled by default. ABH_TELEMETRY_MODE
    # explicitly opts into FULL or FEEDBACK_ONLY reporting; uploading mirrors
    # session-log records onto OTLP/HTTP logs with no session-telemetry/record redaction
    # rule, so exports are the raw captured copy. The deployment stance, env
    # seams, and follow-ups are pinned in the default-off Agent Note.
    # ABH_TELEMETRY_OTLP_URL overrides the production endpoint. A non-empty
    # ABH_TELEMETRY_DISABLED — any value, including '0'/'false' — opts the
    # process out (the launchers patch the row disabled; config cannot disable
    # a row). Exports carry the harness home's anonymous user id ($ABH_HOME/.anonymous-user-id,
    # random UUID; delete the file to reset the identity) as the Resource's
    # user.id. The exporter/processor values normally bound the shutdown drain
    # to ~1s against an unreachable collector: exporter.timeoutMillis is both
    # the per-attempt socket timeout and the retry deadline (1s effectively
    # disables the SDK's 5-try backoff), while maxExportBatchSize == maxQueueSize
    # (both explicit) makes the drain a single batch. The SDK awaits
    # exporter.forceFlush() outside exportTimeoutMillis, so the backend's 3s
    # shutdownTimeoutMillis is the load-bearing outer bound when a transport
    # promise never settles. Every CLI exit path drains it by disposing the root
    # on SIGINT/SIGTERM.
    - id: session-telemetry-otel
      name: '@agentbrain-harness/session-telemetry-otel'
      config:
        mode: !!js process.env.ABH_TELEMETRY_MODE || 'DISABLED'
        shutdownTimeoutMillis: 3000
        exporter:
          # Telemetry is DISABLED by default. There is no vendor endpoint: enabling
          # telemetry requires the operator to point ABH_TELEMETRY_OTLP_URL at their own
          # OTLP collector.
          url: !!js process.env.ABH_TELEMETRY_OTLP_URL ?? ''
          compression: gzip
          timeoutMillis: 1000
        processor:
          scheduledDelayMillis: 10000
          maxQueueSize: 2048
          maxExportBatchSize: 2048
          exportTimeoutMillis: 1500

    - id: subprocess
      name: '@agentbrain-harness/subprocess-local'

    # Every shipped CLI mode starts with the same file-effect boundary.
    # The environment remains an explicit deployment override; otherwise fresh
    # sessions pin workspace-write + ask through the permission service below.
    - id: sandbox
      name: '@agentbrain-harness/sandbox-local'

    - id: sandbox-policy
      name: '@agentbrain-harness/sandbox-policy'
      config:
        mode: !!js process.env.ABH_PERMISSION_MODE ?? 'workspace-write'
        workspaceRoot: !!js process.cwd()

    - id: bash-sandbox
      name: '@agentbrain-harness/bash-sandbox'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000

    - id: pwsh-sandbox
      name: '@agentbrain-harness/pwsh-sandbox'
      disabled: !!js process.platform !== 'win32'

    - id: approval
      name: '@agentbrain-harness/user-approval'
      config:
        policy: !!js "(process.env.ABH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

    - id: permission
      name: '@agentbrain-harness/permission-presets'
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never

    - id: shell-env
      name: '@agentbrain-harness/shell-env'

    - id: tool-bash
      name: '@agentbrain-harness/tool-bash'
      disabled: !!js process.platform === 'win32'

    - id: tool-pwsh
      name: '@agentbrain-harness/tool-pwsh'
      disabled: !!js process.platform !== 'win32'

    - id: tool-jobs
      name: '@agentbrain-harness/tool-jobs'

    - id: fs-observation-policy
      name: '@agentbrain-harness/fs-observation-policy'

    - id: tool-fs
      name: '@agentbrain-harness/tool-fs'

    - id: tool-fs-search
      name: '@agentbrain-harness/tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    - id: agent-instructions
      name: '@agentbrain-harness/agent-instructions'
      config:
        maxBytes: 65536

    # First-class AgentBrain memory using the canonical AgentBrain root resolver;
    # canonical notes live in local/memories and the plugin falls back per workspace.
    - id: agentbrain-memory
      name: '@agentbrain-harness/agentbrain-memory'

    - id: agentbrain-context
      name: '@agentbrain-harness/agentbrain-context'
      config:
        maxBytes: 50000
        maxProjectBytes: 80000
        includePreferences: true

    - id: skill
      name: '@agentbrain-harness/skill'

    - id: skill-filesystem
      name: '@agentbrain-harness/skill-filesystem'

    - id: skill-badge
      name: '@agentbrain-harness/skill-badge'
      disabled: true

    - id: tool-skill
      name: '@agentbrain-harness/tool-skill'

    - id: commands
      name: '@agentbrain-harness/commands'

    - id: agentbrain-commands
      name: '@agentbrain-harness/agentbrain-commands'

    - id: command-feedback
      name: '@agentbrain-harness/command-feedback'

    - id: goal
      name: '@agentbrain-harness/goal'

    - id: goal-round-driver
      name: '@agentbrain-harness/goal-round-driver'

    - id: command-goal
      name: '@agentbrain-harness/command-goal'

    - id: plan-mode
      name: '@agentbrain-harness/plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed only to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

    - id: token-meter
      name: '@agentbrain-harness/token-meter'

    - id: compaction-basic
      name: '@agentbrain-harness/compaction-basic'

    # Human `/compact`: one useful reduction below the automatic threshold. Backend
    # independent, so it follows whichever compaction service this leaf mounts.
    - id: command-compact
      name: '@agentbrain-harness/command-compact'

    - id: subagent
      name: '@agentbrain-harness/subagent'

    - id: subagent-spawn-in-process
      name: '@agentbrain-harness/subagent-spawn-in-process'
      config:
        providerName: spawn

    - id: subagent-fork-in-process
      name: '@agentbrain-harness/subagent-fork-in-process'
      config:
        providerName: fork

    # Continuable background children are selected per delegation tool. The
    # separately loaded follow-up tool registers the one global `send_message`.
    - id: tool-subagent-control
      name: '@agentbrain-harness/tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@agentbrain-harness/tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@agentbrain-harness/tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    # Fork stays one-shot: a continuable child's `report` tool and prompt
    # section precede the inherited history a fork exists to reuse; one-shot
    # fork children install neither, keeping the parent's request prefix.
    # See .agents/notes/implemented/architecture/2026-08-10-fork-children-stay-one-shot.md.
    - id: tool-subagent-fork
      name: '@agentbrain-harness/tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: one-shot

    # Optional direct-child return channel; absent from roots and one-shot agents.
    - id: tool-subagent-report
      name: '@agentbrain-harness/tool-subagent-report'

    - id: workflow-worker-thread
      name: '@agentbrain-harness/workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@agentbrain-harness/tool-workflow'

    - id: timeout-policy
      name: '@agentbrain-harness/tool-call-timeout-policy'

    - id: spill-local
      name: '@agentbrain-harness/spill-local'

    - id: spill-policy
      name: '@agentbrain-harness/spill-policy'
      config:
        maxInlineBytes: 50000

    # Durability checkpoints before each model request and top-level dispatch.
    - id: session-checkpoint-policy
      name: '@agentbrain-harness/session-checkpoint-policy'

    # Compacts oversized tool results before the broader conversation compactor
    # runs, preserving the model-visible result within the configured budget.
    - id: tool-result-pruner
      name: '@agentbrain-harness/compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

    - id: tool-todo
      name: '@agentbrain-harness/tool-todo'
      config:
        allowParallelInProgress: true

    # Persisted same-session goals reach the model and the slash menu here; the
    # domain, driver, and `/goal` command are above.
    - id: tool-goal
      name: '@agentbrain-harness/tool-goal'

    # Fresh-agent Ralph iteration over a build-time-fixed script.
    - id: tool-ralph
      name: '@agentbrain-harness/tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

    - id: tool-str-replace-editor
      name: '@agentbrain-harness/tool-str-replace-editor'
      config:
        maxOutputChars: 16000

    # Consecutive-repeat reminders on the tool chain.
    - id: repeat-tool-reminder
      name: '@agentbrain-harness/repeat-tool-reminder'
      config:
        thresholds: [3, 5, 8]
        argumentsPreviewChars: 500

    # Every mode enables the stable model-facing web_search tool, but no search
    # provider is mounted by default, so search is opt-in through
    # ABH_WEB_SEARCH_PROVIDER or the Models/search settings and the base ships no
    # vendor search route. Fetch stays disabled and no fetch provider is mounted:
    # that provider defers SSRF protection and the model would choose the request
    # target. The tool default stays 30s; a mounted search route can widen its own.
    - id: web
      name: '@agentbrain-harness/web'

    # No vendor search provider is shipped: a mounted `web-search-deepseek` would
    # steer web search to DeepSeek. The `web-search-deepseek` package stays in the
    # tree and choosable; a deployment that wants it mounts it from its own bundle
    # or the Models/search settings (ABH_WEB_SEARCH_PROVIDER). Until a provider is
    # configured, the web_search tool is simply unavailable.

    - id: tool-web
      name: '@agentbrain-harness/tool-web'
      config:
        fetch: false

    # ── rows every mode mounts, whose values each overlay may state ──────────────

    # The tool registry. Presentation mode is a deployment choice; omitting it here
    # keeps the schema default (native).
    - id: tools
      name: '@agentbrain-harness/tools'

    # The deployment persona is a deployment choice; plan-mode and tool plugins own
    # their own prompt sections.
    - id: system-prompt
      name: '@agentbrain-harness/system-prompt'
      config:
        persona: ''

    # Agents created at startup. The base stays empty; raw overlays may create
    # agents, while Web creates sessions on client request.
    - id: agent-loop
      name: '@agentbrain-harness/agent-loop'
      config:
        agents: []

    # The sandboxed filesystem provider. `cwd` defaults to `process.cwd()`; an
    # overlay can pin another workspace.
    - id: fs-sandbox
      name: '@agentbrain-harness/fs-sandbox'

    # The native DeepSeek adapter is NOT mounted by default: mounting it declares a
    # `deepseek-official` provider row the user cannot remove, which is vendor
    # steering. DeepSeek stays fully choosable through the provider-neutral pi-ai
    # `default` route (its OpenAI-compatible endpoint: baseURL https://api.deepseek.com,
    # a key, and a model), and the `llm-deepseek` package remains in the tree for a
    # deployment that wants the native adapter from its own bundle.
